name: Deploy

#   prod  -> Netlify production deploy (serves the Whogohost domain)
# Deploys only run after the quality gates pass, and are skipped entirely when
# the Netlify secrets are absent, so a fresh clone of the repo does not fail.
on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verify before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Are the Netlify secrets present?
        id: check
        env:
          TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          SITE: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$SITE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID not set. Build verified, deploy skipped. See DEPLOYMENT.md."
          fi

  deploy:
    name: Deploy to Netlify
    needs: gate
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.ref_name == 'prod' && 'production' || 'preview' }}
      url: ${{ steps.netlify.outputs.url }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Publish
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          npx --yes netlify-cli@latest deploy \
            --dir=dist \
            --prod \
            --message "prod ${{ github.sha }}" \
            --json > deploy.json

          URL=$(node -p "const d=require('./deploy.json'); d.url || d.deploy_url")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Deployed to production" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- url: $URL" >> "$GITHUB_STEP_SUMMARY"
