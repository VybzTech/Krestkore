[build]
  command = "npm run build"
  publish = "dist"

# Client-side routes must fall back to index.html or a deep link 404s.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "22"

# Builds are driven by GitHub Actions, which runs the quality gates first and
# then calls the Netlify CLI. Netlify's own auto-build is disabled in the UI so
# a push does not trigger two builds. See DEPLOYMENT.md.

# Hash-named assets are immutable; the HTML entry point must never be cached.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# One block for /*. Netlify's header matching is not context-aware in the way
# build settings are, so there is deliberately no X-Robots-Tag here: a blanket
# noindex that failed to be overridden per-context would quietly deindex the
# live site. Netlify already sends noindex on deploy previews and branch
# deploys by default, which is exactly the behaviour we want.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    # script-src allows 'unsafe-inline' for one reason: the theme bootstrap in
    # index.html must run before first paint to avoid a flash, and it is inline
    # by necessity. A hash would be tighter but has to be regenerated by hand
    # every time that snippet changes, which reliably rots. External script
    # origins are still blocked, which is the drive-by risk that matters here.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'self' https://formspree.io; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formspree.io"

[context.production]
  [context.production.environment]
    NODE_ENV = "production"
    NPM_FLAGS = "--include=dev"
